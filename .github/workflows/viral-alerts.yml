name: Viral Video Alerts

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never run two at once — overlapping runs could both alert the same post
# before either commits its alerts state file.
concurrency:
  group: viral-alerts
  cancel-in-progress: false

jobs:
  check-viral:
    runs-on: ubuntu-latest
    strategy:
      # Each client is its own job, so one failing doesn't stop the other.
      fail-fast: false
      matrix:
        include:
          - client: krea
            state_file: alerted_posts.json
          - client: micro1
            state_file: alerted_posts_micro1.json
          - client: tab
            state_file: alerted_posts_tab.json
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send viral alerts
        env:
          LAUNCHPOINT_MCP_URL: ${{ secrets.LAUNCHPOINT_MCP_URL }}
          LAUNCHPOINT_API_KEY: ${{ secrets.LAUNCHPOINT_API_KEY }}
          LAUNCHPOINT_CAMPAIGN_ID: ${{ secrets.LAUNCHPOINT_CAMPAIGN_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALERT_START_DATE: ${{ vars.ALERT_START_DATE }}
          MICRO1_CAMPAIGN_ID: ${{ secrets.MICRO1_CAMPAIGN_ID }}
          MICRO1_SLACK_WEBHOOK_URL: ${{ secrets.MICRO1_SLACK_WEBHOOK_URL }}
          MICRO1_SLACK_BOT_TOKEN: ${{ secrets.MICRO1_SLACK_BOT_TOKEN }}
          MICRO1_SLACK_CHANNEL_ID: ${{ secrets.MICRO1_SLACK_CHANNEL_ID }}
          MICRO1_ALERT_START_DATE: ${{ vars.MICRO1_ALERT_START_DATE }}
          TAB_CAMPAIGN_ID: ${{ secrets.TAB_CAMPAIGN_ID }}
          TAB_SLACK_WEBHOOK_URL: ${{ secrets.TAB_SLACK_WEBHOOK_URL }}
          TAB_ALERT_START_DATE: ${{ vars.TAB_ALERT_START_DATE }}
        run: python viral_alerts.py --client ${{ matrix.client }}

      - name: Commit ${{ matrix.state_file }}
        # Run even if the alert step failed partway, so alerts that did go out are recorded.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.state_file }}"
          if git diff --cached --quiet; then
            echo "No new alerts to record."
          else
            git commit -m "Record ${{ matrix.client }} viral alerts [skip ci]"
            # The other client's job may push at the same moment; each touches
            # only its own state file, so rebasing onto it never conflicts.
            for attempt in 1 2 3; do
              git pull --rebase && git push && break
              sleep $((attempt * 5))
            done
          fi
