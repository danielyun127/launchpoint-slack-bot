name: Daily LaunchPoint Report

on:
  schedule:
    # Daily at 9:00 AM Pacific. GitHub cron is UTC-only, so this fires at
    # both 16:00 UTC (9am PDT) and 17:00 UTC (9am PST), and the gate job
    # below lets through only the one that is 9am Pacific today. No changes
    # needed when daylight saving starts or ends.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: "One client to send (krea, micro1, tab, wron, fomo, teamily); empty sends all"
        required: false
        default: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      send: ${{ steps.gate.outputs.send }}
    steps:
      - name: Check it's 9am Pacific
        id: gate
        run: |
          # Gate on which cron fired, not the current time, so a run GitHub
          # starts late still sends exactly once. Manual runs always send.
          offset=$(TZ=America/Los_Angeles date +%z)  # -0700 PDT, -0800 PST
          if [ "${{ github.event_name }}" != "schedule" ] \
            || { [ "$offset" = "-0700" ] && [ "${{ github.event.schedule }}" = "0 16 * * *" ]; } \
            || { [ "$offset" = "-0800" ] && [ "${{ github.event.schedule }}" = "0 17 * * *" ]; }; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 9am Pacific (offset $offset, cron '${{ github.event.schedule }}'); skipping."
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

  send-report:
    needs: gate
    # Skips every client's job on the run that isn't 9am Pacific.
    if: needs.gate.outputs.send == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Each client is its own job, so one failing doesn't stop the other.
      fail-fast: false
      # Most clients share one LaunchPoint API key, which gets rate limited
      # (429) when too many jobs call it at once.
      max-parallel: 2
      matrix:
        # Wron AI and FOMO are paused: add "wron" / "fomo" back here to resume.
        client: ${{ fromJSON(inputs.client && format('["{0}"]', inputs.client) || '["krea", "micro1", "tab", "teamily"]') }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send report
        env:
          LAUNCHPOINT_MCP_URL: ${{ secrets.LAUNCHPOINT_MCP_URL }}
          LAUNCHPOINT_API_KEY: ${{ secrets.LAUNCHPOINT_API_KEY }}
          LAUNCHPOINT_CAMPAIGN_ID: ${{ secrets.LAUNCHPOINT_CAMPAIGN_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLIENT_NAME: ${{ secrets.CLIENT_NAME }}
          KREA_TOTAL_BUDGET: ${{ secrets.KREA_TOTAL_BUDGET }}
          MICRO1_CAMPAIGN_ID: ${{ secrets.MICRO1_CAMPAIGN_ID }}
          MICRO1_SLACK_WEBHOOK_URL: ${{ secrets.MICRO1_SLACK_WEBHOOK_URL }}
          MICRO1_VIDEO_GOAL: ${{ vars.MICRO1_VIDEO_GOAL }}
          MICRO1_MIN_VIEWS: ${{ vars.MICRO1_MIN_VIEWS }}
          TAB_CAMPAIGN_ID: ${{ secrets.TAB_CAMPAIGN_ID }}
          TAB_SLACK_WEBHOOK_URL: ${{ secrets.TAB_SLACK_WEBHOOK_URL }}
          TAB_VIDEO_GOAL: ${{ vars.TAB_VIDEO_GOAL }}
          TAB_MIN_VIEWS: ${{ vars.TAB_MIN_VIEWS }}
          MICRO1_SLACK_BOT_TOKEN: ${{ secrets.MICRO1_SLACK_BOT_TOKEN }}
          MICRO1_SLACK_CHANNEL_ID: ${{ secrets.MICRO1_SLACK_CHANNEL_ID }}
          WRON_CAMPAIGN_ID: ${{ secrets.WRON_CAMPAIGN_ID }}
          WRON_SLACK_WEBHOOK_URL: ${{ secrets.WRON_SLACK_WEBHOOK_URL }}
          WRON_TOTAL_BUDGET: ${{ secrets.WRON_TOTAL_BUDGET }}
          FOMO_CAMPAIGN_ID: ${{ secrets.FOMO_CAMPAIGN_ID }}
          FOMO_SLACK_WEBHOOK_URL: ${{ secrets.FOMO_SLACK_WEBHOOK_URL }}
          FOMO_POSTHOG_SHARED_URL: ${{ secrets.FOMO_POSTHOG_SHARED_URL }}
          TEAMILY_CAMPAIGN_ID: ${{ vars.TEAMILY_CAMPAIGN_ID }}
          TEAMILY_TOTAL_BUDGET: ${{ secrets.TEAMILY_TOTAL_BUDGET }}
          TEAMILY_AGENT_ID: ${{ secrets.TEAMILY_AGENT_ID }}
          TEAMILY_GROUP_ID: ${{ secrets.TEAMILY_GROUP_ID }}
          # Only Teamily's job gets its Teamily agent key.
          TEAMILY_AGENT_API_KEY: ${{ matrix.client == 'teamily' && secrets.TEAMILY_AGENT_API_KEY || '' }}
          # Wron AI is on its own LaunchPoint account; only its job gets this key.
          WRON_LAUNCHPOINT_API_KEY: ${{ matrix.client == 'wron' && secrets.WRON_LAUNCHPOINT_API_KEY || '' }}
        run: python main.py --client ${{ matrix.client }}
