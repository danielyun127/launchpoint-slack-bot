name: Daily LaunchPoint Report

on:
  schedule:
    # 9:00 AM Pacific Daylight Time (UTC-7) = 16:00 UTC.
    # NOTE: US DST ends the first Sunday of November. Once clocks fall back
    # to Pacific Standard Time (UTC-8), this will fire at 8:00 AM PST
    # instead of 9:00 AM. Update to '0 17 * * *' then (and back to
    # '0 16 * * *' when DST resumes in March) if you want it locked to 9am.
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    strategy:
      # Each client is its own job, so one failing doesn't stop the other.
      fail-fast: false
      matrix:
        client: [krea, micro1, tab]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send report
        env:
          LAUNCHPOINT_MCP_URL: ${{ secrets.LAUNCHPOINT_MCP_URL }}
          LAUNCHPOINT_API_KEY: ${{ secrets.LAUNCHPOINT_API_KEY }}
          LAUNCHPOINT_CAMPAIGN_ID: ${{ secrets.LAUNCHPOINT_CAMPAIGN_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLIENT_NAME: ${{ secrets.CLIENT_NAME }}
          KREA_TOTAL_BUDGET: ${{ secrets.KREA_TOTAL_BUDGET }}
          MICRO1_CAMPAIGN_ID: ${{ secrets.MICRO1_CAMPAIGN_ID }}
          MICRO1_SLACK_WEBHOOK_URL: ${{ secrets.MICRO1_SLACK_WEBHOOK_URL }}
          MICRO1_VIDEO_GOAL: ${{ vars.MICRO1_VIDEO_GOAL }}
          MICRO1_MIN_VIEWS: ${{ vars.MICRO1_MIN_VIEWS }}
          TAB_CAMPAIGN_ID: ${{ secrets.TAB_CAMPAIGN_ID }}
          TAB_SLACK_WEBHOOK_URL: ${{ secrets.TAB_SLACK_WEBHOOK_URL }}
          TAB_VIDEO_GOAL: ${{ vars.TAB_VIDEO_GOAL }}
          TAB_MIN_VIEWS: ${{ vars.TAB_MIN_VIEWS }}
          MICRO1_SLACK_BOT_TOKEN: ${{ secrets.MICRO1_SLACK_BOT_TOKEN }}
          MICRO1_SLACK_CHANNEL_ID: ${{ secrets.MICRO1_SLACK_CHANNEL_ID }}
        run: python main.py --client ${{ matrix.client }}
